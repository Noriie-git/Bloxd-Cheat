<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloxd.io Cheats - clients, userscripts and downloads">
  <title>Bloxd.io Cheats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-grid"></div>

  <main class="container">
    <header class="hero">
      <div class="title-container">
        <img src="BloxdIcon.png" alt="Bloxd Icon" class="hero-icon">
        <h1>Bloxd.io Cheats</h1>
      </div>
      <p>Cheat Client for Bloxd.io</p>
    </header>

    <section class="cards">
      <article class="card">
        <div class="shine"></div>
        <div class="card-content">
          <h2>Fallen Client</h2>
          <p>Version 1.7</p>
          
          <!-- BỘ ĐẾM LƯỢT TẢI FALLEN -->
          <div class="dl-badge">
            <span class="dl-icon">📥</span>
            <span id="count-fallen">0</span> downloads
          </div>
          
          <a class="button primary" href="Fallen.txt" download onclick="incrementDownload('fallen')">Download</a>
          <a class="button discord" href="https://discord.gg/DM4cFBnPTH" target="_blank" rel="noopener noreferrer">
            <span class="discord-icon">●</span> Discord
          </a>
        </div>
      </article>

      <article class="card">
        <div class="shine"></div>
        <div class="card-content">
          <h2>Shitizen Client</h2>
          <p>Version idk</p>
          
          <!-- BỘ ĐẾM LƯỢT TẢI SHITIZEN -->
          <div class="dl-badge">
            <span class="dl-icon">📥</span>
            <span id="count-shitizen">0</span> downloads
          </div>
          
          <a class="button primary" href="Shitizen.txt" download onclick="incrementDownload('shitizen')">Download</a>
          <a class="button discord" href="https://discord.gg/fXwuQtVD9t" target="_blank" rel="noopener noreferrer">
            <span class="discord-icon">●</span> Discord
          </a>
        </div>
      </article>
    </section>

    <footer>
      <span>Bloxd Cheats</span>
      <span>•</span>
      <span>GitHub Pages</span>
    </footer>
  </main>

  <div id="notice" class="notice" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
